[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applogmon"
version = "0.1.0"
description = "Lightweight live log monitoring for Python applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
applogmon = "applogmon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["qa"]
pythonpath = ["src"]
addopts = "-ra"
